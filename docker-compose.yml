# Local development database only. Credentials below are throwaway dev values.
services:
  db:
    image: mysql:8.4
    container_name: doodi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: doodi_root_dev
      MYSQL_DATABASE: doodi
      MYSQL_USER: doodi
      MYSQL_PASSWORD: doodi_dev_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - doodi-mysql:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdoodi_root_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  doodi-mysql:
